{% extends "base.html" %}

{% block title %}Experiments — TailHedge{% endblock %}

{% block content %}
<div class="page">
    <h1 class="page__title">Research</h1>

    <nav class="sub-navigation" aria-label="Research sub-navigation">
        <ul class="sub-navigation__list">
            <li class="sub-navigation__item">
                <a href="/research/campaigns" class="sub-navigation__link">Campaigns</a>
            </li>
            <li class="sub-navigation__item">
                <a href="/research/experiments" class="sub-navigation__link sub-navigation__link--active"
                   aria-current="page">Experiments</a>
            </li>
            <li class="sub-navigation__item">
                <a href="/research/releases" class="sub-navigation__link">Candidates / Releases</a>
            </li>
        </ul>
    </nav>

    <section class="card" aria-labelledby="experiments">
        <h2 id="experiments" class="card__title">Experiments</h2>
        <div class="empty-state" role="status">
            <p class="empty-state__text">No experiments recorded yet.</p>
        </div>
    </section>
</div>
{% endblock %}
