{% extends "base.html" %}

{% block title %}Broker Health — TailHedge{% endblock %}

{% block content %}
<div class="page">
    <h1 class="page__title">Operations</h1>

    <nav class="sub-navigation" aria-label="Operations sub-navigation">
        <ul class="sub-navigation__list">
            <li class="sub-navigation__item">
                <a href="/operations/daily-runs" class="sub-navigation__link">Daily Runs</a>
            </li>
            <li class="sub-navigation__item">
                <a href="/operations/orders" class="sub-navigation__link">Orders</a>
            </li>
            <li class="sub-navigation__item">
                <a href="/operations/broker-health" class="sub-navigation__link sub-navigation__link--active"
                   aria-current="page">Broker Health</a>
            </li>
        </ul>
    </nav>

    <section class="card" aria-labelledby="broker-health">
        <h2 id="broker-health" class="card__title">Broker Health</h2>
        <div class="empty-state" role="status">
            <p class="empty-state__text">No broker connection configured.</p>
            <p class="empty-state__actions">
                <a href="/settings/integrations" class="button button--primary">Configure Broker</a>
            </p>
        </div>
    </section>
</div>
{% endblock %}
