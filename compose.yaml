# Local development services.
# Usage: docker compose up -d
# Test/integration suite: export TAILHEDGE_TEST_DATABASE_URL=postgresql+psycopg://tailhedge:tailhedge@localhost:5432/tailhedge_test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: tailhedge
      POSTGRES_PASSWORD: tailhedge
      POSTGRES_DB: tailhedge_test
    ports:
      - "5432:5432"
    volumes:
      - tailhedge_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tailhedge"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  tailhedge_pgdata:
