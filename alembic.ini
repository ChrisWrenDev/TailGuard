# Alembic configuration for TailHedge

[alembic]
script_location = src/tailhedge/persistence/migrations
prepend_sys_path = .

# Database URL — overridden at runtime from Secrets config.
# This default is used only by `alembic init` and overridden in env.py.
sqlalchemy.url = postgresql+psycopg://tailhedge:tailhedge@localhost:5432/tailhedge

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
